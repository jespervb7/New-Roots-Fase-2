[project]
site_url = "https://jespervb7.github.io/New-Roots-Fase-2/"
site_name = "New Roots Fase 2"
strict = true
# site_description = "Your project description"
site_author = "Jesper van Beemdelust"

copyright = "This content is provided for general information only, “as is,” and is not professional advice. Use your own judgment and consult experts before relying on it."

repo_url = "https://github.com/jespervb7/New-Roots-Fase-2"
repo_name = "jespervb7/New-Roots-Fase-2"
edit_uri = "edit/main/docs/"

# Each top-level entry is a tab. The first page of a section (index.md) is its landing page.
nav = [
  { "Home" = "index.md" },
  { "Mijn woning" = [
    "mijn-woning/index.md",
    { "Installaties" = [
      { "Luchtfilters vervangen" = "mijn-woning/luchtfilters-vervangen.md" },
    ] },
  ] },
  { "Gebouw & omgeving" = [
    "gebouw-en-omgeving/index.md",
    { "Handig om te weten" = "gebouw-en-omgeving/handig-om-te-weten.md" },
    { "Openstaande punten" = "gebouw-en-omgeving/openstaande-punten.md" },
  ] },
  { "Verhuizen" = [
    "verhuizen/index.md",
    { "Verhuischecklist" = "verhuizen/verhuischecklist.md" },
  ] },
  { "VvE & contact" = [
    "vve-en-contact/index.md",
    { "Contactgegevens" = "vve-en-contact/contactgegevens.md" },
  ] },
  { "Bijdragen" = [
    "bijdragen/index.md",
    { "Markdown in 5 minuten" = "bijdragen/markdown.md" },
    { "Opmaakvoorbeelden" = "bijdragen/opmaakvoorbeelden.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "nl"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

# [[project.extra.status]]
new = "Recently added"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Glossary: includes/afkortingen.md is appended to every page, so each abbreviation gets a tooltip site-wide.
pymdownx.snippets.base_path = ["includes"]
pymdownx.snippets.auto_append = ["afkortingen.md"]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
