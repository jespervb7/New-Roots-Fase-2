repos:
  - repo: local
    hooks:
      # Sets "Laatst geüpdatet" (revision_date) to today on every page you changed.
      # If it updates a date, the commit stops: run `git add` and commit again.
      - id: revision-date
        name: Update "Laatst geüpdatet" date on changed pages
        entry: uv run python scripts/revision_dates.py update
        language: system
        files: ^docs/.*\.md$
      - id: zensical-build
        name: Build documentation with Zensical
        entry: uv run python -m zensical build --strict
        language: system
        files: ^(docs/|includes/|zensical\.toml$|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
